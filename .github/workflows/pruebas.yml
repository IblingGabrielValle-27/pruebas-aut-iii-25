name: CI PRUEBAS autorizadas (develop)

on:
    push:
        branches:
            - dev
    pull_request:
        branches:
            - dev
jobs:
    test_aplication:
        name: Ejecutar pruebas automatizadas
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.13'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run tests
              run: |
                  echo "Ejecutando pruebas automatizadas..."
                  python -m pytest --rootdir . -s
            - name: Notify success
              if: ${{ failure()}}
              run: echo "Algunas pruebas han fallado, por favor revisa los resultados."